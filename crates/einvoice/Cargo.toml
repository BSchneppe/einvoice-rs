[package]
name = "einvoice"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"
description = "Immutable invoice documents and explicit, version-pinned validation reports"
# BSC-12 enables publication after validation, builder and release gates pass.
publish = false
repository = "https://github.com/BSchneppe/einvoice-rs"

[dependencies]
einvoice-numeric = { path = "../einvoice-numeric" }
# Error classification and parser provenance are tied to this exact version.
xml-rs = "=0.8.28"
# Retain lexical namespace declarations that xml-rs collapses into a map.
xmlparser = "=0.13.6"
thiserror = "2.0.11"
