[package]
name = "einvoice-schema"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
license-file = "../../LICENSE"
description = "Internal bounded source-to-schema execution, without invoice acceptance"
readme = "README.md"

[dependencies]
einvoice-source = { path = "../einvoice-source" }
xsd-schema = { version = "=0.3.0", default-features = true }
sha2 = "=0.10.9"
serde = { version = "=1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.140"

[target.'cfg(unix)'.dev-dependencies]
# Nonblocking regular-file-only development input opens; already in the lock.
libc = "=0.2.173"

[[example]]
name = "cii-observe"
test = true
