name: Maintained XSD backend

on:
  pull_request:
    paths:
      - 'vendor/xsd-schema/**'
      - 'vendor/xsd-schema.provenance.json'
      - 'vendor/xsd-schema-patches/**'
      - 'tools/schema-backend/**'
      - '.github/workflows/schema-backend.yml'
  push:
    branches: [main]
    paths:
      - 'vendor/xsd-schema/**'
      - 'vendor/xsd-schema.provenance.json'
      - 'vendor/xsd-schema-patches/**'
      - 'tools/schema-backend/**'
      - '.github/workflows/schema-backend.yml'

permissions:
  contents: read

jobs:
  default-backend:
    name: Rust 1.83 default backend (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/tools/schema-backend/target
    steps:
      # Preserve the published LF and CRLF bytes on every platform. The package
      # inventory deliberately includes upstream files with both line endings.
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust 1.83
        run: rustup toolchain install 1.83.0 --profile minimal --component rustfmt --component clippy
      - name: Set archive path
        run: echo "XSD_UPSTREAM_ARCHIVE=$RUNNER_TEMP/xsd-schema-0.3.0.crate" >> "$GITHUB_ENV"
      - name: Supply pinned upstream archive
        run: |
          python -c 'import os, pathlib, urllib.request; pathlib.Path(os.environ["XSD_UPSTREAM_ARCHIVE"]).write_bytes(urllib.request.urlopen("https://crates.io/api/v1/crates/xsd-schema/0.3.0/download").read())'
      - name: Verify source bytes, ordered patches and offline mutation rejection
        run: |
          python tools/schema-backend/verify_provenance.py --archive "$XSD_UPSTREAM_ARCHIVE"
          python -m unittest discover -s tools/schema-backend -p 'test_*.py' -v
      - name: Identify and enforce enabled default features
        run: python tools/schema-backend/verify_features.py --target '${{ matrix.target }}'
      - name: Backend regressions
        run: cargo +1.83.0 test --locked --manifest-path tools/schema-backend/Cargo.toml --target '${{ matrix.target }}'
      - name: Unchanged upstream public integration suites
        run: python tools/schema-backend/run_upstream.py
      - name: Raw diagnostics and Result layout versus manifest-only upstream
        run: python tools/schema-backend/compare_upstream.py "$XSD_UPSTREAM_ARCHIVE" --output tools/schema-backend/target/raw-comparison
      - name: Formatting
        run: |
          cargo +1.83.0 fmt --manifest-path tools/schema-backend/Cargo.toml --all -- --check
          rustfmt +1.83.0 --edition 2021 --check vendor/xsd-schema/src/validation/errors.rs vendor/xsd-schema/src/validation/simple.rs vendor/xsd-schema/src/validation/runtime.rs vendor/xsd-schema/src/validation/validator.rs vendor/xsd-schema/src/validation/quick_xml_driver.rs vendor/xsd-schema/src/validation/navigator_driver.rs
      - name: Clippy
        run: |
          cargo +1.83.0 clippy --locked --manifest-path tools/schema-backend/Cargo.toml --all-targets -- -D warnings
          cargo +1.83.0 clippy --locked --manifest-path tools/schema-backend/Cargo.toml -p xsd-schema --lib -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +1.83.0 doc --locked --manifest-path tools/schema-backend/Cargo.toml --no-deps --document-private-items
