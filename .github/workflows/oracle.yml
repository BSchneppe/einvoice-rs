name: Reference oracle
on:
  pull_request:
    paths:
      - 'tools/oracle/**'
      - '.github/workflows/oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '27.0.1'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install corpus reader
        run: pip install -r tools/oracle/requirements-test.txt
      - name: Fetch checksum-pinned development inputs
        run: python3 tools/oracle/oracle.py fetch
      - name: Reproduce corpus and verify frozen inventory
        run: |
          python3 tools/oracle/oracle.py corpus
          git diff --exit-code -- tools/oracle/corpus tools/oracle/workload.json
      - name: Test public tooling behavior against KoSIT
        run: python3 -m unittest discover -s tools/oracle/tests -v
      - name: Fetch locked native probe dependencies
        run: |
          cargo fetch --locked --manifest-path tools/oracle/probes/xpath/Cargo.toml
          cargo fetch --locked --manifest-path tools/oracle/probes/xsd/Cargo.toml
      - name: Reproduce semantic counterexamples offline
        run: |
          python3 tools/oracle/probes.py
          cargo run --locked --offline --manifest-path tools/oracle/probes/xsd/Cargo.toml -- tools/oracle/.cache
