name: CI

on:
  pull_request:
    branches:
      - main
      - refactor/native-rust-workspace


jobs:
  test-suite:
    name: Run Test Suite
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel # x86
            target: x86_64-apple-darwin
          - os: macos-15 # Apple Silicon
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test library
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: 'test'
          target: ${{ matrix.target }}
          toolchain: 1.83.0
          args: "--locked --all-features --workspace"

  facade-package:
    name: Test facade source dependency archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.83.0
          profile: minimal
          override: true
      - name: Fetch committed workspace dependencies
        run: cargo +1.83.0 fetch --locked
      - name: Archive source dependencies outside the checkout
        id: archive
        shell: bash
        run: |
          bundle_dir="$(mktemp -d)"
          archive_dir="$(mktemp -d)"
          git archive --format=tar --output="$bundle_dir/source.tar" HEAD -- \
            Cargo.toml Cargo.lock LICENSE crates/einvoice crates/einvoice-numeric
          tar -xf "$bundle_dir/source.tar" -C "$archive_dir"
          echo "directory=$archive_dir" >> "$GITHUB_OUTPUT"
      - name: Project the lock onto the source dependency workspace
        working-directory: ${{ steps.archive.outputs.directory }}
        # Core is absent: prune the extracted lock while retaining locked registry
        # versions. Original manifests and the lock inside source.tar stay intact.
        # The checkout's rustup override does not apply to this external path.
        run: cargo +1.83.0 update --workspace --offline
      # The numeric path dependency is unpublished. This checks source closure,
      # not Cargo package inclusion/normalization, registry or release readiness.
      - name: Test and run the source dependency archive offline
        working-directory: ${{ steps.archive.outputs.directory }}
        run: |
          cargo +1.83.0 test --locked --offline --all-features -p einvoice -p einvoice-numeric
          cargo +1.83.0 run --locked --offline -p einvoice --example workflows

  check-format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.83.0
          profile: minimal
          override: true
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.83.0
          profile: minimal
          override: true
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy check
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --locked --all-targets --all-features --workspace -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.83.0
          profile: minimal
          override: true
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --locked --no-deps --document-private-items --all-features --workspace --examples
