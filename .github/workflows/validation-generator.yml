name: Validation frontend
on:
  pull_request:
    paths:
      - 'tools/validation-generator/**'
      - 'tools/oracle/artifacts.lock.json'
      - 'tools/oracle/notices/**'
      - '.github/workflows/validation-generator.yml'
  push:
    branches: [main]
    paths:
      - 'tools/validation-generator/**'
      - 'tools/oracle/artifacts.lock.json'
      - 'tools/oracle/notices/**'
      - '.github/workflows/validation-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_MANIFEST: tools/validation-generator/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch isolated locked dependencies
        run: cargo +1.83.0 fetch --manifest-path "$CARGO_MANIFEST" --locked
      - name: Tests
        run: cargo +1.83.0 test --manifest-path "$CARGO_MANIFEST" --workspace --all-features --locked --offline
      - name: Format
        run: cargo +1.83.0 fmt --manifest-path "$CARGO_MANIFEST" --all -- --check
      - name: Clippy
        run: cargo +1.83.0 clippy --manifest-path "$CARGO_MANIFEST" --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.83.0 doc --manifest-path "$CARGO_MANIFEST" --workspace --no-deps --document-private-items --all-features --locked --offline --examples
      - name: Explicit verified acquisition
        run: python3 tools/validation-generator/scripts/fetch.py --out tools/validation-generator/.cache/archives
      - name: Full pinned source accounting and byte determinism
        run: python3 tools/validation-generator/scripts/generate.py --archives tools/validation-generator/.cache/archives --out tools/validation-generator/.cache/ci-output --check-accounting tools/validation-generator/SOURCE-ACCOUNTING.json --check-candidate-accounting tools/validation-generator/CANDIDATE-ACCOUNTING.json --check-correspondence-accounting tools/validation-generator/CORRESPONDENCE-ACCOUNTING.json
      - name: Retain full inspection and candidate for review (non-executable)
        uses: actions/upload-artifact@v4
        with:
          name: non-executable-validation-ir
          path: |
            tools/validation-generator/.cache/ci-output/one
            tools/validation-generator/.cache/ci-output/candidate-one
            tools/validation-generator/.cache/ci-output/correspondence-one.json
