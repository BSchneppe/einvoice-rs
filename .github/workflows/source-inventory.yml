name: Static source inventory
on:
  pull_request:
    paths:
      - 'tools/source-inventory/**'
      - '.github/workflows/source-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'tools/source-inventory/**'
      - '.github/workflows/source-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic static inventory tests (no source acquisition or execution)
        run: python -B -m unittest discover -s tools/source-inventory -p test_inventory.py -v
