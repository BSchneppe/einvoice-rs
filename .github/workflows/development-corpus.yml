name: DEVELOPMENT corpus evidence

on:
  push:
    paths:
      - 'tools/development-corpus/**'
      - '.github/workflows/development-corpus.yml'
  pull_request:
    paths:
      - 'tools/development-corpus/**'
      - '.github/workflows/development-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact retained DEVELOPMENT bytes and bindings
        run: >-
          python -B tools/development-corpus/verify.py
          --manifest tools/development-corpus/publication.json
          --out "$RUNNER_TEMP/development-evidence-report.json"
      - name: Exercise evidence failure boundaries and real synthetic subprocesses
        run: python -B -m unittest discover -s tools/development-corpus/tests -v
